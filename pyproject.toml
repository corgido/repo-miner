[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-miner"
dynamic = ["version"]
description = "Understand a repository from its history: what happened, who knows what, and what to ask."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "corgido" }]
keywords = ["git", "history", "onboarding", "codebase", "forensics", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/corgido/repo-miner"
Issues = "https://github.com/corgido/repo-miner/issues"

[project.scripts]
repo-miner = "repo_miner.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/repo-miner" }
packages = ["repo_miner"]

[tool.setuptools.package-data]
repo_miner = ["templates/*.md"]

[tool.setuptools.dynamic]
version = { attr = "repo_miner.__version__" }
