name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo, an invented messy repository (must end with a clean check)
        run: |
          bin/repo-miner demo | tee demo.log
          tail -1 demo.log | grep -qx "demo: clean"

  real-repository:
    name: Mine a public repository
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Mine commander.js, every branch, anonymised
        run: bin/repo-miner https://github.com/tj/commander.js --anonymise --out report
      - name: Leak-scan the report
        run: bin/repo-miner scan report
      - name: The report has its sections and findings
        run: |
          grep -q "## What stands out" report/REPORT.md
          grep -q "## Questions for the people" report/REPORT.md
          python -c "import json; f = json.load(open('report/findings.json')); assert len(f) >= 3, f; print(len(f), 'findings')"
      - uses: actions/upload-artifact@v4
        with:
          name: commander.js-report
          path: report/

  package:
    name: Install with pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: The installed command works
        run: |
          repo-miner --version
          repo-miner demo | tail -1 | grep -qx "demo: clean"
